    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 0;
  }

  .lp-navbar-fixed {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-color);
    transition: background-color 0.3s ease;
  }

  [data-theme="light"] .lp-navbar-fixed {

  /* CANVAS BINTANG BULAT SEMPURNA */
  function initStarNetworkCanvas() {
    var canvas = document.getElementById('starNetworkCanvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var particles = [];
    var particleCount = 60;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    for (var i = 0; i < particleCount; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5,
        radius: Math.random() * 2 + 0.8,
        alpha: Math.random() * 0.7 + 0.3
      });
    }

    function animate() {
      if (!document.getElementById('starNetworkCanvas')) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      var starColor = isDark ? '255, 255, 255' : '37, 99, 235';
      var lineColor = isDark ? '168, 85, 247' : '37, 99, 235';

      for (var i = 0; i < particleCount; i++) {
        var p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + starColor + ',' + p.alpha + ')';
        ctx.fill();

        for (var j = i + 1; j < particleCount; j++) {
          var p2 = particles[j];
          var dx = p.x - p2.x;
          var dy = p.y - p2.y;
          var dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 130) {
            var lineAlpha = (1 - dist / 130) * (isDark ? 0.22 : 0.12);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = 'rgba(' + lineColor + ',' + lineAlpha + ')';
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();
  }

  function initScrollAnimation() {
    var targets = document.querySelectorAll('.lp-hero-title, .lp-hero-sub, .lp-hero-card, .lp-bento-mini, .lp-stepper-card, .lp-split-item, .lp-section-title, .accordion-item');
    if (!targets.length) return;

    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    targets.forEach(function(el) {
      el.classList.add('animate-on-scroll');
      observer.observe(el);
    });

    initStarNetworkCanvas();
    initDynamicSocialProof();
  }
