  function getTimeGreeting() {
    var hour = new Date().getHours();
    if (hour >= 4 && hour < 11) return 'Selamat Pagi';
    if (hour >= 11 && hour < 15) return 'Selamat Siang';
    if (hour >= 15 && hour < 18) return 'Selamat Sore';
    return 'Selamat Malam';
  }

  function getValidImage(url, defaultUrl) {
    if (!url || !url.trim() || url.indexOf('15ClZ7DM1N.png') !== -1 || url.indexOf('imglink.cc') !== -1) {
      return defaultUrl;
    }
    var cleanUrl = url.trim();
    if (cleanUrl.indexOf('drive.google.com') !== -1) {
      var match = cleanUrl.match(/\/d\/([^\/\?]+)/) || cleanUrl.match(/id=([^&]+)/);
      if (match && match[1]) {
        return 'https://lh3.googleusercontent.com/d/' + match[1];
      }
    }
    return cleanUrl;
  }

  function formatFrontendLabel(value) {
    var text = String(value || '');
    var map = {
      'ADMIN': 'Admin',
      'MEMBER': 'Member',
      'PUBLIC': 'Public',
      'PRIVATE': 'Private',
      'ACTIVE': 'Active',
      'INACTIVE': 'Inactive'
    };
    return map[text.toUpperCase()] || text;
  }

  function initScrollAnimations() {
    if (!('IntersectionObserver' in window)) {
      document.querySelectorAll('.animate-on-scroll').forEach(function(el) {
        el.classList.add('is-visible');
      });
      return;
    }

    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
        }
      });
    }, { threshold: 0.12 });

    document.querySelectorAll('.animate-on-scroll').forEach(function(el) {
      observer.observe(el);
    });
  }

  var crudModalInstance = null;
  var videoModalInstance = null;
  var allNotifModalInstance = null;
  var announcementModalInstance = null;

  function parseIconClass(rawIcon, defaultIcon) {
    if (!rawIcon || !rawIcon.trim()) return defaultIcon || 'bi bi-stars';
    var icon = rawIcon.trim();
    if (icon === 'bi-shield-check-fill' || icon === 'shield-check-fill') icon = 'bi-shield-fill-check';
    if (icon.startsWith('bi ') || icon.startsWith('fa ') || icon.startsWith('fab ') || icon.startsWith('fas ')) return icon;
    if (icon.startsWith('bi-')) return 'bi ' + icon;
    if (icon.startsWith('fa-')) return 'fa ' + icon;
    return 'bi bi-' + icon;
  }

  function applyStaggerAnimation() {
    setTimeout(function() {
      var container = document.getElementById('mainContent');
      if (!container) return;
      
      var targets = container.querySelectorAll('.row > [class*="col"], .table-responsive tbody tr, .welcome-card, .card-custom');
      if (!targets.length) return;

      var isFastView = (STATE.currentView === 'dashboard' || STATE.currentView === 'members' || STATE.currentView === 'settings');

      targets.forEach(function(el, idx) {
        var delay = isFastView ? Math.min(idx * 20, 300) : Math.min(idx * 85, 1000);
        var animDuration = isFastView ? 220 : 350;

        el.style.animationDuration = animDuration + 'ms';
        el.style.animationDelay = delay + 'ms';
        el.classList.add('stagger-item');

        setTimeout(function() {
          el.classList.remove('stagger-item');
          el.style.animation = 'none';
          el.style.opacity = '1';
          el.style.transform = '';
        }, delay + animDuration + 50);
      });
    }, 15);
  }

  function forceInstantLogout(msg) {
    STATE.token = '';
    STATE.user = null;
    STATE.isPreloaded = false;
    STATE.isPreviewMode = false;
    STATE.notifications = [];
    STATE.unreadNotifCount = 0;
    STATE.dashboardCache = null;
    STATE.settingsCache = null;
    STATE.dataStore = { tools: {}, courses: {}, community: {}, websites: {}, accessWebs: {}, bonuses: {}, karyaMembers: {}, members: {} };
    
    localStorage.removeItem('WHYDEV_TOKEN');
    localStorage.removeItem('WHYDEV_LAST_VIEW');
    
    if (window.heartbeatInterval) clearInterval(window.heartbeatInterval);
    if (window.sidebarClockInterval) clearInterval(window.sidebarClockInterval);
    if (window.lpSocialProofInterval) clearInterval(window.lpSocialProofInterval);
    if (window.lpSocialProofTimeout) clearTimeout(window.lpSocialProofTimeout);
    
    hideLoading();
    showToast(msg || 'Akun Anda telah dinonaktifkan oleh Admin.', 'error');
    renderView('login');
  }

  function runBackend(functionName) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(resolve, reject) {
    var runner = google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success === false && res.message) {
          var lower = String(res.message).toLowerCase();
          if (lower.includes('nonaktif') || lower.includes('sesi') || lower.includes('berakhir') || lower.includes('ditolak') || lower.includes('akun_nonaktif')) {
            forceInstantLogout(res.message.replace('AKUN_NONAKTIF: ', ''));
            return resolve(res);
          }
        }
        resolve(res);
      })
      .withFailureHandler(function(err) {
        if (err && err.message) {
          var lower = String(err.message).toLowerCase();
          if (lower.includes('nonaktif') || lower.includes('sesi') || lower.includes('berakhir') || lower.includes('ditolak') || lower.includes('akun_nonaktif')) {
            forceInstantLogout(err.message.replace('AKUN_NONAKTIF: ', ''));
          }
        }
        reject(err);
      });

    if (typeof runner[functionName] === 'function') {
      runner[functionName].apply(runner, args);
    } else {
      reject(new Error('Fungsi backend "' + functionName + '" tidak ditemukan di Code.gs. Pastikan skrip sudah di-save dan di-deploy ulang.'));
    }
  });
}

  function startHeartbeat() {
    if (window.heartbeatInterval) clearInterval(window.heartbeatInterval);
    function sendPing() {
      if (STATE.token && STATE.user) {
        runBackend('pingHeartbeat', STATE.token).then(function(res) {
          if (res && !res.success) {
            forceInstantLogout(res.message);
          } else if (res && typeof res.unreadNotif !== 'undefined') {
            STATE.unreadNotifCount = res.unreadNotif;
            var dot = document.getElementById('notifBadgeDot');
            if (dot) {
              if (STATE.unreadNotifCount > 0) dot.classList.add('show');
              else dot.classList.remove('show');
            }
          }
        }).catch(function(err) {
          if (err && err.message) forceInstantLogout(err.message);
        });
      }
    }
    sendPing();
    window.heartbeatInterval = setInterval(sendPing, 15000);
  }

  function preloadAllData() {
    if (!STATE.token) return;
    runBackend('getAllPortalData', STATE.token).then(function(res) {
      if (res && res.success && res.data) {
        ['tools', 'courses', 'community', 'websites', 'accessWebs', 'bonuses', 'karyaMembers'].forEach(function(key) {
          STATE.dataStore[key] = {};
          (res.data[key] || []).forEach(function(item) {
            STATE.dataStore[key][item.ID] = item;
          });
        });
        STATE.isPreloaded = true;
      }
    });

    if (STATE.user && STATE.user.role === 'ADMIN') {
      runBackend('getMembers', STATE.token).then(function(res) {
        if (res && res.success) {
          STATE.dataStore.members = {};
          (res.data || []).forEach(function(item) { STATE.dataStore.members[item.id] = item; });
        }
      });
    }

    loadNotifications();
  }

  document.addEventListener('DOMContentLoaded', function() {
    var crudModalEl = document.getElementById('crudModal');
    var videoModalEl = document.getElementById('videoModal');
    var allNotifModalEl = document.getElementById('allNotifModal');
    var announcementModalEl = document.getElementById('announcementModal');

    if (crudModalEl) crudModalInstance = new bootstrap.Modal(crudModalEl);
    if (videoModalEl) videoModalInstance = new bootstrap.Modal(videoModalEl);
    if (allNotifModalEl) allNotifModalInstance = new bootstrap.Modal(allNotifModalEl);
    if (announcementModalEl) announcementModalInstance = new bootstrap.Modal(announcementModalEl);

    showLoading(true);
    var savedView = localStorage.getItem('WHYDEV_LAST_VIEW') || 'landing';

    runBackend('getInitialAppData', STATE.token)
      .then(function(res) {
        hideLoading();
        if (res.success) {
          if (res.settings) {
            for (var k in res.settings) STATE.settings[k] = res.settings[k];
            STATE.settingsCache = res.settings;
          }

          if (!localStorage.getItem('WHYDEV_THEME') && STATE.settings.default_theme) {
            STATE.theme = STATE.settings.default_theme;
          }
          applyTheme(STATE.theme);

          if (res.user) {
            STATE.user = res.user;
            if (res.dashboard && res.dashboard.success) {
              STATE.dashboardCache = res.dashboard;
            }
            var targetView = (savedView && savedView !== 'landing' && savedView !== 'login') ? savedView : 'dashboard';
            renderView(targetView);
            preloadAllData();
            startHeartbeat();
          } else {
            STATE.token = '';
            localStorage.removeItem('WHYDEV_TOKEN');
            if (res.landingData) STATE.landingData = res.landingData;
            var targetView = (savedView === 'login') ? 'login' : 'landing';
            renderView(targetView);
          }
        } else {
          applyTheme(STATE.theme);
          renderView('landing');
        }
      })
      .catch(function() {
        hideLoading();
        applyTheme(STATE.theme);
        renderView('landing');
      });
  });

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('WHYDEV_THEME', theme);
    STATE.theme = theme;
    
    var btns = document.querySelectorAll('.theme-toggle-btn');
    btns.forEach(function(btn) {
      btn.innerHTML = theme === 'dark' ? '<i class="bi bi-sun-fill text-warning"></i>' : '<i class="bi bi-moon-stars-fill"></i>';
    });
    var themeMenuItems = document.querySelectorAll('.theme-menu-toggle');
    themeMenuItems.forEach(function(item) {

        '</div>';
      function onEscape(ev) {
        if (ev.key === 'Escape' && document.getElementById('whydevConfirmOverlay')) finish(false);

      function finish(value) {
        document.removeEventListener('keydown', onEscape);
        overlay.remove();
        resolve(value);

      overlay.addEventListener('click', function(ev) {
        if (ev.target === overlay) finish(false);
        var choice = ev.target.closest('[data-choice]');
        if (choice) finish(choice.getAttribute('data-choice') === 'yes');

  function getImageSource(fileId, linkId, fallbackValue, required) {
    var fileInput = document.getElementById(fileId);
    var linkInput = document.getElementById(linkId);
    var hasFile = fileInput && fileInput.files && fileInput.files[0];
    var linkValue = linkInput ? String(linkInput.value || '').trim() : '';
    if (hasFile) return readImageFile(fileId, fallbackValue || '');
    if (linkValue) return Promise.resolve(linkValue);
    if (fallbackValue) return Promise.resolve(fallbackValue);
    if (required) return Promise.reject(new Error('Silakan pilih file gambar atau masukkan link gambar terlebih dahulu.'));
    return Promise.resolve('');
  }

  function syncImageSource(fileId, linkId, textId, mode) {
    var fileInput = document.getElementById(fileId);
    var linkInput = document.getElementById(linkId);
    var text = document.getElementById(textId);
    if (mode === 'file') {
      if (linkInput) linkInput.value = '';
      if (text) text.textContent = fileInput && fileInput.files && fileInput.files[0] ? fileInput.files[0].name : 'Belum ada file dipilih';
    } else if (mode === 'link') {
      if (linkInput && String(linkInput.value || '').trim() && fileInput) fileInput.value = '';
      if (text && (!fileInput || !fileInput.files || !fileInput.files[0])) text.textContent = 'Belum ada file dipilih';
    }
  }

  function openStyledFilePicker(fileId) {
    var input = document.getElementById(fileId);
    if (input) input.click();
  }

  function readImageFile(inputId, fallbackValue) {
    return new Promise(function(resolve, reject) {
      var input = document.getElementById(inputId);
      if (!input || !input.files || !input.files[0]) {
        resolve(fallbackValue || '');
        return;
      }
      var file = input.files[0];
      if (!file.type || file.type.indexOf('image/') !== 0) {
        reject(new Error('File yang dipilih harus berupa gambar.'));
        return;
      }
      var reader = new FileReader();
      reader.onload = function(e) { resolve(e.target.result); };
      reader.onerror = function() { reject(new Error('Gagal membaca file gambar.')); };
      reader.readAsDataURL(file);
    });
  }

  function imageFileChangeText(inputId, textId) {
    var input = document.getElementById(inputId);
    var text = document.getElementById(textId);
    if (!input || !text) return;
    text.textContent = input.files && input.files[0] ? input.files[0].name : 'Belum ada file dipilih';
  }

  function getNotificationIconColor(item) {
    var key = String((item && item.targetUrl) || '').trim();
    var map = {
      dashboard: 'notif-color-dashboard',
      courses: 'notif-color-courses',
      tools: 'notif-color-tools',
      websites: 'notif-color-websites',
      accessWebs: 'notif-color-access',
      bonuses: 'notif-color-bonus',
      community: 'notif-color-community',
      karyaMembers: 'notif-color-karya',

  function cleanNotificationTitle(title) {
    return String(title || '').replace(/^\s*(?:Tutorial Baru|Bonus Baru|Akses Web Baru|Tool Baru|Tools Baru|Pengumuman Baru)\s*:\s*/i, '').trim();
  }

  function renderNotificationDropdown() {
    var container = document.getElementById('notifDropdownList');
    if (!container) return;

    var list = STATE.notifications.slice(0, 5); // Tampilkan 5 terbaru saja
    if (list.length === 0) {
      container.innerHTML = '<div class="p-3 text-center text-muted small"><i class="bi bi-bell-slash fs-4 d-block mb-1"></i>Belum ada notifikasi</div>';
      return;

    container.innerHTML = list.map(function(item) {
      var unreadClass = item.isRead ? '' : 'unread';
      var icon = item.iconClass || 'bi bi-bell-fill';
      var iconColor = getNotificationIconColor(item);
      var title = cleanNotificationTitle(item.title);
      var date = item.createdAt ? String(item.createdAt).split(' ')[0] : '';

      return '<div class="notif-item ' + unreadClass + '" onclick="handleMarkRead(\'' + item.id + '\', \'' + item.targetUrl + '\')">' +
        '<div class="notif-icon-box ' + iconColor + '"><i class="' + icon + '"></i></div>' +
        '<div class="min-w-0 flex-grow-1 notif-content">' +
          '<div class="fw-bold small notif-title" title="' + title + '">' + title + '</div>' +

            '<span class="text-muted notif-date">' + date + '</span>' +
          '</div>' +

  function handleMarkRead(notifId, targetUrl) {
    var item = STATE.notifications.find(function(n) { return String(n.id) === String(notifId); });
    if (item) item.isRead = true;
    STATE.unreadNotifCount = STATE.notifications.filter(function(n) { return !n.isRead; }).length;
    var dot = document.getElementById('notifBadgeDot');
    if (dot) dot.classList.toggle('show', STATE.unreadNotifCount > 0);
    renderNotificationDropdown();

    runBackend('markNotificationAsRead', STATE.token, notifId).then(function() {
      loadNotifications();
      if (allNotifModalInstance) allNotifModalInstance.hide();
      if (targetUrl) {
        switchNav(targetUrl);
      }
    });
  }

  function startClocks() {
    if (window.sidebarClockInterval) clearInterval(window.sidebarClockInterval);
    function tick() {
      var now = new Date();
      var timeStr = String(now.getHours()).padStart(2, '0') + ':' + 
                    String(now.getMinutes()).padStart(2, '0') + ':' + 
                    String(now.getSeconds()).padStart(2, '0');
      
      var headerTimeEl = document.getElementById('headerTime');
      if (headerTimeEl) headerTimeEl.innerText = timeStr;
    }
    tick();
    window.sidebarClockInterval = setInterval(tick, 1000);
  }

  function filterItemsByPreview(items) {
    if (!Array.isArray(items)) return [];
    if (STATE.user && STATE.user.role === 'ADMIN' && !STATE.isPreviewMode) {
      return items;
    }
    var currentUserId = STATE.user ? String(STATE.user.id || STATE.user.ID || '') : '';
    return items.filter(function(i) {
      if (!i) return false;
      var st = String(i.Status || i.status || '').toUpperCase();
      var itemUserId = String(i.UserID || i.userId || i.userID || i.userid || '');
      var isOwner = currentUserId && itemUserId === currentUserId;
      return isOwner || st === 'APPROVED' || st === 'PUBLIC' || st === 'ACTIVE';
    });
  }

  function loadViewContent(view) {
    var container = document.getElementById('mainContent');

    if ((STATE.isPreviewMode || (STATE.user && STATE.user.role !== 'ADMIN')) && (view === 'members' || view === 'settings')) {
      view = 'dashboard';
      STATE.currentView = 'dashboard';
    }

    var viewsMap = {
      courses: { render: renderCoursesView, key: 'courses', backendFn: 'getCourses' },
      tools: { render: renderToolsView, key: 'tools', backendFn: 'getTools' },
      websites: { render: renderWebsitesView, key: 'websites', backendFn: 'getWebsites' },
      accessWebs: { render: renderAccessWebsView, key: 'accessWebs', backendFn: 'getAccessWebs' },
      bonuses: { render: renderBonusesView, key: 'bonuses', backendFn: 'getBonuses' },
      community: { render: renderCommunityView, key: 'community', backendFn: 'getCommunity' },
      karyaMembers: { render: renderKaryaMemberView, key: 'karyaMembers', backendFn: 'getKaryaMembers' }
    };

    if (viewsMap[view]) {
      var storeKey = viewsMap[view].key;
      var cachedItems = Object.values(STATE.dataStore[storeKey] || {});

      if (cachedItems.length > 0) {
        hideLoading();
        container.innerHTML = '<div class="fade-in-content">' + viewsMap[view].render(filterItemsByPreview(cachedItems)) + '</div>';
        applyStaggerAnimation();
        
        runBackend(viewsMap[view].backendFn, STATE.token).then(function(res) {
          if (res && res.success && Array.isArray(res.data)) {
            STATE.dataStore[storeKey] = {};
            res.data.forEach(function(item) {
              var itemId = item.ID || item.id || ('KRY_' + Math.random());
              STATE.dataStore[storeKey][itemId] = item;
            });
          }
        }).catch(function(){});
        return;
      }

      showLoading(false);
      runBackend(viewsMap[view].backendFn, STATE.token).then(function(res) {
        hideLoading();
        if (res && res.success) {
          STATE.dataStore[storeKey] = {};
          (res.data || []).forEach(function(item) {
            var itemId = item.ID || item.id || ('KRY_' + Math.random());
            STATE.dataStore[storeKey][itemId] = item;
          });
          container.innerHTML = '<div class="fade-in-content">' + viewsMap[view].render(filterItemsByPreview(res.data || [])) + '</div>';
          applyStaggerAnimation();
        } else {
          container.innerHTML = '<div class="card-custom p-4 text-center my-4"><i class="bi bi-exclamation-triangle text-warning fs-1 mb-2"></i><h5 class="fw-bold">Gagal Memuat Data</h5><p class="text-muted small mb-0">' + (res ? res.message : 'Terjadi kesalahan sistem') + '</p></div>';
        }
      }).catch(function(err) {
        hideLoading();
        container.innerHTML = '<div class="card-custom p-4 text-center my-4"><i class="bi bi-wifi-off text-danger fs-1 mb-2"></i><h5 class="fw-bold">Koneksi Terputus</h5><p class="text-muted small mb-0">' + (err.message || 'Tidak dapat terhubung ke server') + '</p></div>';
      });
      return;
    }

    if (view === 'dashboard') {
      if (STATE.dashboardCache) {
        hideLoading();
        container.innerHTML = '<div class="fade-in-content">' + renderDashboardView(STATE.dashboardCache) + '</div>';
        applyStaggerAnimation();
        runBackend('getDashboardData', STATE.token).then(function(res) {
          if (res && res.success) STATE.dashboardCache = res;
        });
        return;
      }

      showLoading(false);
      runBackend('getDashboardData', STATE.token).then(function(res) {
        hideLoading();
        if (res && res.success) {
          STATE.dashboardCache = res;
          container.innerHTML = '<div class="fade-in-content">' + renderDashboardView(res) + '</div>';
          applyStaggerAnimation();
          preloadAllData();
        }
      }).catch(function() { hideLoading(); });

    } else if (view === 'members') {
      var cachedMembers = Object.values(STATE.dataStore.members || {});
      if (cachedMembers.length > 0) {
        hideLoading();
        container.innerHTML = '<div class="fade-in-content">' + renderMembersView(cachedMembers) + '</div>';
        applyStaggerAnimation();
        runBackend('getMembers', STATE.token).then(function(res) {
          if (res && res.success) {
            STATE.dataStore.members = {};
            (res.data || []).forEach(function(item) { STATE.dataStore.members[item.id] = item; });
          }
        });
        return;
      }

      showLoading(false);
      runBackend('getMembers', STATE.token).then(function(res) {
        hideLoading();
        if (res && res.success) {
          STATE.dataStore.members = {};
          (res.data || []).forEach(function(item) { STATE.dataStore.members[item.id] = item; });
          container.innerHTML = '<div class="fade-in-content">' + renderMembersView(res.data || []) + '</div>';
          applyStaggerAnimation();
        }
      }).catch(function() { hideLoading(); });

    } else if (view === 'settings') {
      if (STATE.settingsCache) {
        hideLoading();
        container.innerHTML = '<div class="fade-in-content">' + renderSettingsView(STATE.settingsCache) + '</div>';
        applyStaggerAnimation();
        runBackend('getSettings').then(function(resSettings) {
          if (resSettings && resSettings.success) STATE.settingsCache = resSettings.data;
        });
        return;
      }

      showLoading(false);
      runBackend('getSettings')
        .then(function(resSettings) {
          hideLoading();
          if (resSettings && resSettings.success) {
            STATE.settingsCache = resSettings.data;
            container.innerHTML = '<div class="fade-in-content">' + renderSettingsView(resSettings.data) + '</div>';
            applyStaggerAnimation();
          }
        })
        .catch(function() { hideLoading(); });
    } else if (view === 'profile') {
      hideLoading();
      container.innerHTML = '<div class="fade-in-content">' + renderProfileView() + '</div>';
      applyStaggerAnimation();
    }
  }

  function togglePasswordVisibility(inputId, btn) {
    var input = document.getElementById(inputId);
    var icon = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'bi bi-eye';
    }
  }

  function handleLogin(e) {
    e.preventDefault();
    var u = document.getElementById('loginUsername').value;
    var p = document.getElementById('loginPassword').value;
    var loginBtn = document.getElementById('loginSubmitBtn');

    if (loginBtn) {
      loginBtn.disabled = true;
      loginBtn.dataset.originalHtml = loginBtn.innerHTML;
      loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Memproses...';
    }

    runBackend('login', u, p, 'Web Browser')
      .then(function(res) {
        if (res.success) {
          STATE.token = res.token;
          STATE.user = res.user;
          localStorage.setItem('WHYDEV_TOKEN', res.token);
          showToast('Login berhasil! Selamat datang ' + res.user.nama, 'success');
          renderView('dashboard');
          preloadAllData();
          startHeartbeat();
        } else {
          if (loginBtn) {
            loginBtn.disabled = false;
            loginBtn.innerHTML = loginBtn.dataset.originalHtml || 'Login Portal';
          }
          showToast(res.message, 'error');
        }
      })
      .catch(function(err) {
        if (loginBtn) {
          loginBtn.disabled = false;
          loginBtn.innerHTML = loginBtn.dataset.originalHtml || 'Login Portal';
        }
        showToast(err.message || 'Terjadi kesalahan sistem', 'error');
      });
  }
  function handleLogout() {
    showLoading(true);
    runBackend('logout', STATE.token)
      .then(function() {
        forceInstantLogout('Logout berhasil.');
      })
      .catch(function() {
        forceInstantLogout('Logout selesai.');
      });
  }

  function selectAddType(type) {
    if (!STATE.user || STATE.user.role !== 'ADMIN' || STATE.isPreviewMode) return;

    // Tetap gunakan instance crudModal yang sama. Jangan hide() lalu show()
    // kembali karena Bootstrap dapat menghapus backdrop lama saat backdrop baru
    // sedang dibuat, sehingga form berikutnya tampil tanpa overlay gelap.
    var crudModal = document.getElementById('crudModal');
    if (crudModal) crudModal.classList.remove('add-choice-active');

    switch (type) {
      case 'courses': openCourseModal(); break;
      case 'tools': openToolModal(); break;
      case 'websites': openWebsiteModal(); break;
      case 'accessWebs': openAccessWebModal(); break;
      case 'bonuses': openBonusModal(); break;
      case 'community': openCommunityModal(); break;
      case 'karyaMembers': openKaryaMemberModal(); break;
      case 'members': openAddMemberModal(); break;

  function getLogEmail(l) {
    var raw = (l.Email || l.Username || '').trim();
    if (raw.includes('@')) {
      return raw.replace(/@whydev\.com$/i, '@gmail.com');
    }

    if (STATE.dataStore.members) {
      for (var k in STATE.dataStore.members) {
        var m = STATE.dataStore.members[k];
        if (m.id === raw || m.username === raw || m.nama === raw) {
          if (m.email && m.email.includes('@')) {
            return m.email.replace(/@whydev\.com$/i, '@gmail.com');
          }
        }
      }
    }
    
    return raw ? raw + '@gmail.com' : 'admin@gmail.com';
  }

      items.map(function(k) {

          var hargaText = (isJual && hargaFormatted) ? ' (Rp ' + hargaFormatted + ')' : '';

          '<div class="p-3 p-lg-2.5 d-flex flex-column flex-grow-1 justify-content-between">' +
            '<div>' +
              '<div class="d-flex align-items-center justify-content-between mb-2">' +

              (k.Deskripsi ? '<p class="text-muted small mb-3 text-truncate-2 karya-description">' + k.Deskripsi + '</p>' : '') +
            '</div>' +

            '<div class="d-flex flex-column gap-2 mt-2">' +
              '<div class="d-flex gap-2 align-items-stretch">' +
                '<a href="' + (k.DemoURL || '#') + '" target="_blank" rel="noopener noreferrer" class="btn btn-primary-custom btn-sm flex-grow-1 text-center py-2 px-2 card-btn-text d-flex align-items-center justify-content-center gap-1 rounded-3"><i class="bi bi-box-arrow-up-right"></i><span>Lihat Demo</span></a>' +
                (hasWa ? '<a href="' + waLink + '" target="_blank" rel="noopener noreferrer" class="btn btn-success btn-sm text-center py-2 px-2.5 fw-bold d-flex align-items-center justify-content-center gap-1 rounded-3" style="flex-shrink: 0;" title="Chat WA"><i class="bi bi-whatsapp"></i><span>Chat</span></a>' : '') +
              '</div>' +
              
              ((isAdmin || isOwner) ? '<div class="d-flex align-items-center justify-content-between pt-2 border-top gap-1">' +
                '<div class="btn-group btn-group-sm w-100">' +
                  (isAdmin ? '<button class="btn ' + (isPending ? 'btn-success' : 'btn-outline-warning') + ' btn-sm py-1" onclick="handleToggleKaryaStatus(\'' + k.ID + '\')" title="Ubah Status Approve">' + (isPending ? '<i class="bi bi-check-lg me-1"></i>Approve' : '<i class="bi bi-x-circle me-1"></i>Unapprove') + '</button>' : '') +
                  '<button class="btn btn-outline-secondary btn-sm py-1" onclick="openKaryaMemberModal(\'' + k.ID + '\')" title="Edit"><i class="bi bi-pencil"></i></button>' +
                  '<button class="btn btn-outline-danger btn-sm py-1" onclick="confirmDelete(\'deleteKaryaMember\', \'' + k.ID + '\')" title="Hapus"><i class="bi bi-trash"></i></button>' +
                '</div>' +
              '</div>' : '') +
            '</div>' +
          '</div>' +
        '</div></div>';
      }).join('') +
    '</div>';
  }

    var namaPembuatDefault = data ? (data.NamaPembuat || '') : '';
    var tipeKaryaDefault = data ? (data.TipeKarya || 'SHOWCASE') : 'SHOWCASE';

    document.getElementById('crudModalTitle').innerText = isEdit ? 'Edit Karya Member' : 'Upload Karya Member';
    document.getElementById('crudModalBody').innerHTML = '<form onsubmit="saveKaryaMember(event, \'' + (isEdit ? data.ID : '') + '\')">' +
      '<div class="mb-3"><label class="form-label small fw-bold">Judul Karya / Nama Aplikasi</label><input type="text" id="kJudul" class="form-control" value="' + (data ? data.JudulKarya : '') + '" placeholder="Masukkan nama karya member" required></div>' +
      '<div class="mb-3"><label class="form-label small fw-bold">Nama Pembuat Karya</label><input type="text" id="kPembuat" class="form-control" value="' + namaPembuatDefault + '" placeholder="Masukkan nama asli Anda" required></div>' +
      '<div class="mb-3"><label class="form-label small fw-bold">Link Demo Aplikasi (URL)</label><input type="url" id="kDemo" class="form-control" value="' + (data ? data.DemoURL : '') + '" placeholder="Masukkan link demo karya member" required></div>' +

      '<div class="mb-3"><label class="form-label small fw-bold">Deskripsi Singkat Karya (Opsional)</label><textarea id="kDeskripsi" class="form-control" rows="2" placeholder="Jelaskan keunggulan atau fitur utama karya kamu...">' + (data ? (data.Deskripsi || '') : '') + '</textarea></div>' +
      '<div class="row g-2 mb-3">' +
        '<div class="col-12 col-md-4"><label class="form-label small fw-bold">Tipe Karya</label><select id="kTipe" class="form-select" onchange="toggleLinkBeliInput(this.value)"><option value="SHOWCASE" ' + (tipeKaryaDefault === 'SHOWCASE' ? 'selected' : '') + '>Showcase (Portofolio)</option><option value="DIJUAL" ' + (tipeKaryaDefault === 'DIJUAL' ? 'selected' : '') + '>Bisa Dibeli (Dijual)</option></select></div>' +
        '<div class="col-6 col-md-4" id="hargaWrapper" style="' + (tipeKaryaDefault === 'DIJUAL' ? '' : 'display:none;') + '"><label class="form-label small fw-bold">Harga Karya (Rp)</label><input type="number" id="kHarga" class="form-control" value="' + (data ? (data.Harga || '') : '') + '" placeholder="Contoh: 150000"></div>' +
        '<div class="col-6 col-md-4" id="linkBeliWrapper" style="' + (tipeKaryaDefault === 'DIJUAL' ? '' : 'display:none;') + '"><label class="form-label small fw-bold">Nomor WA / Link WA</label><input type="text" id="kLinkBeli" class="form-control" value="' + (data ? (data.LinkBeli || '') : '') + '" placeholder="628123456789"></div>' +
      '</div>' +
      '<div class="text-end"><button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Batal</button><button type="submit" class="btn btn-primary-custom">Kirim Karya</button></div>' +
    '</form>';
    crudModalInstance.show();

  function toggleLinkBeliInput(val) {
    var wrapperLink = document.getElementById('linkBeliWrapper');
    var wrapperHarga = document.getElementById('hargaWrapper');
    var isJual = (val === 'DIJUAL');
    if (wrapperLink) wrapperLink.style.display = isJual ? 'block' : 'none';
    if (wrapperHarga) wrapperHarga.style.display = isJual ? 'block' : 'none';
  }

  function reloadKaryaMembersView() {
    return runBackend('getKaryaMembers', STATE.token).then(function(res) {
      if (res && res.success) {
        STATE.dataStore.karyaMembers = {};
        (res.data || []).forEach(function(item) {
          STATE.dataStore.karyaMembers[item.ID] = item;
        });
        if (STATE.currentView === 'karyaMembers') {
          var container = document.getElementById('mainContent');
          if (container) {
            var items = Object.values(STATE.dataStore.karyaMembers);
            container.innerHTML = '<div class="fade-in-content">' + renderKaryaMemberView(filterItemsByPreview(items)) + '</div>';
          }
        }
      }
    });
  }

  async function saveKaryaMember(e, id) {
    e.preventDefault();

    var sendNotif = false;
    if (!id && STATE.user && STATE.user.role === 'ADMIN' && !STATE.isPreviewMode) {
      sendNotif = await askSendNotification();
    }

    var finalThumb = await getImageSource('kThumbFile','kThumbUrl', id && STATE.dataStore.karyaMembers[id] ? STATE.dataStore.karyaMembers[id].Thumbnail : '', false);
    showLoading(false);

    var payload = {
      judulKarya: document.getElementById('kJudul').value,
      namaPembuat: document.getElementById('kPembuat').value,
      demoURL: document.getElementById('kDemo').value,
      thumbnail: finalThumb,
      deskripsi: document.getElementById('kDeskripsi').value,
      tipeKarya: document.getElementById('kTipe').value,
      harga: document.getElementById('kHarga') ? document.getElementById('kHarga').value : '',
      linkBeli: document.getElementById('kLinkBeli') ? document.getElementById('kLinkBeli').value : '',
      sendNotif: sendNotif
    };

    crudModalInstance.hide();
    var fn = id ? runBackend('updateKaryaMember', STATE.token, id, payload) : runBackend('addKaryaMember', STATE.token, payload);
    fn.then(function(res) {
      if (res && res.success) { 
        showToast(res.message); 
        reloadKaryaMembersView().finally(function() {
          hideLoading();
        });
      } else { 
        hideLoading();
        showToast(res ? res.message : 'Gagal menyimpan karya', 'error'); 
      }
    }).catch(function(err) {
      hideLoading();
      showToast('Gagal menyimpan: ' + (err.message || 'Terjadi kesalahan'), 'error');
    });
  }

  function handleToggleKaryaStatus(id) {
    showLoading(false);
    runBackend('toggleKaryaStatus', STATE.token, id).then(function(res) {
      if (res && res.success) {
        showToast(res.message);
        reloadKaryaMembersView().finally(function() {
          hideLoading();
        });
      } else { 
        hideLoading();
        showToast(res ? res.message : 'Gagal mengubah status', 'error'); 
      }
    }).catch(function(err) {
      hideLoading();
      showToast(err.message || 'Terjadi kesalahan sistem', 'error');
    });
  }

  function renderContentCategory(item) {
    var category = item && (item.Category || item.category || '');
    category = String(category).trim();
    return category ? '<span class="badge bg-primary-subtle text-primary border border-primary-subtle fw-bold content-category-badge"><i class="bi bi-tag-fill me-1"></i>' + category + '</span>' : '';
  }

    (items.length === 0 ? renderEmptyState() : '<div class="row g-2 g-md-3">' +

          '<div class="card-img-wrapper"><i class="bi bi-image lazy-image-icon" aria-hidden="true"></i>' + privateBadge + '<img src="' + imgUrl + '" alt="' + t.Title + '" loading="lazy" onload="this.classList.add(\'img-loaded\')" onerror="this.onerror=null; this.classList.add(\'img-loaded\'); this.src=\'' + DEFAULT_IMAGES.tools + '\';"></div>' +

      }).join('') +

  function extractYoutubeId(url) {

    var ytId = extractYoutubeId(c.YoutubeURL);

  function handleYtThumbLoad(img, ytId) {
    if (!img) return;
    img.classList.add('img-loaded');
  }

  function handleYtThumbError(img, ytId) {
    if (!img) return;
    var step = parseInt(img.getAttribute('data-yt-fallback-step') || '0', 10);
    if (ytId && step === 0) {
      img.setAttribute('data-yt-fallback-step', '1');
      img.src = 'https://img.youtube.com/vi/' + ytId + '/mqdefault.jpg';
      return;
    }
    if (ytId && step === 1) {
      img.setAttribute('data-yt-fallback-step', '2');
      img.src = 'https://img.youtube.com/vi/' + ytId + '/sddefault.jpg';
      return;
    }
    img.src = 'https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg';
    img.classList.add('img-loaded');
  }

      if (typeA === 'Member Trial' && typeB === 'Member Lifetime') return 1;

      if (a.isOnline && !b.isOnline) return -1;
      if (!a.isOnline && b.isOnline) return 1;

  function saveUnifiedMember(e) {
    e.preventDefault();
    var rawEmails = document.getElementById('mEmails').value.trim();
    var inputNama = document.getElementById('mNama').value.trim() || 'Member Why Dev';
    var role = document.getElementById('mRole').value;
    var defaultPass = (role === 'ADMIN') ? 'admin123' : 'member123';
    var inputPass = document.getElementById('mPass').value.trim() || defaultPass;
    var status = document.getElementById('mStatus').value;
    var memberType = document.getElementById('mMemberType').value;
    var trialDays = document.getElementById('mTrialDays') ? document.getElementById('mTrialDays').value : 1;

    var emailList = rawEmails.split('\n').map(function(item) { return item.trim(); }).filter(function(item) { return item.length > 0; });

    if (emailList.length === 0) {
      showToast('Masukkan minimal satu email', 'error');
      return;
    }

    crudModalInstance.hide();
    showLoading(false);

    var payload = {
      nama: inputNama,
      username: emailList[0],
      email: emailList[0],
      password: inputPass,
      role: role,
      status: status,
      memberType: memberType,
      trialDays: trialDays
    };

    runBackend('addMember', STATE.token, payload).then(function(res) {
      hideLoading();
      if (res.success) { 
        showToast(res.message); 
        STATE.dataStore.members = {}; 
        loadViewContent('members'); 
      }
      else { showToast(res.message, 'error'); }
    });
  }

        '<label class="form-label small fw-bold">Password</label>' +
        '<div class="password-input-wrapper">' +
          '<input type="text" id="mEditPass" class="form-control" value="' + (m.password || '') + '" required style="padding-right: 48px;">' +

  function toggleEditTrialDaysInput(type) {

    if (wrapper) wrapper.style.display = (type === 'Member Trial') ? 'block' : 'none';

  function saveEditMember(e, id) {
    e.preventDefault();
    var payload = {
      nama: document.getElementById('mEditNama').value,
      email: document.getElementById('mEditEmail').value,
      password: document.getElementById('mEditPass').value,
      role: document.getElementById('mEditRole').value,
      status: document.getElementById('mEditStatus').value,
      memberType: document.getElementById('mEditMemberType').value,
      trialDays: document.getElementById('mEditTrialDays') ? document.getElementById('mEditTrialDays').value : ''
    };
    crudModalInstance.hide();
    showLoading(false);
    runBackend('updateMember', STATE.token, id, payload).then(function(res) {
      hideLoading();
      if (res.success) { 
        showToast(res.message); 
        STATE.dataStore.members = {}; 
        loadViewContent('members'); 
      }
      else { showToast(res.message, 'error'); }
    });
  }

  function openResetPasswordModal(id, nama) {
    document.getElementById('crudModalTitle').innerText = 'Reset Password — ' + nama;
    document.getElementById('crudModalBody').innerHTML = '<form onsubmit="saveResetPassword(event, \'' + id + '\')">' +
      '<div class="mb-4"><label class="form-label small fw-bold">Password Baru (Tanpa Hash)</label><input type="text" id="mNewPass" class="form-control" placeholder="Masukkan password baru" required></div>' +
      '<div class="text-end"><button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Batal</button><button type="submit" class="btn btn-primary-custom">Reset Password</button></div>' +
    '</form>';
    crudModalInstance.show();
  }

  function saveResetPassword(e, id) {
    e.preventDefault();
    var p = document.getElementById('mNewPass').value;
    crudModalInstance.hide();
    showLoading(false);
    runBackend('resetMemberPassword', STATE.token, id, p).then(function(res) {
      hideLoading();
      if (res.success) showToast(res.message);
      else showToast(res.message, 'error');

  function handleToggleStatus(id) {
    showLoading(false);
    runBackend('toggleMemberStatus', STATE.token, id).then(function(res) {
      hideLoading();
      if (res.success) { 
        showToast(res.message); 
        STATE.dataStore.members = {}; 
        loadViewContent('members'); 
      }
      else { showToast(res.message, 'error'); }
    });

  function filterMembersTable() {
    var searchEl = document.getElementById('memberSearch');
    var roleEl = document.getElementById('memberRoleFilter');
    var statusEl = document.getElementById('memberStatusFilter');
    var q = searchEl ? searchEl.value.trim().toLocaleLowerCase() : '';
    var role = roleEl ? String(roleEl.value || '').trim().toUpperCase() : '';
    var status = statusEl ? String(statusEl.value || '').trim().toUpperCase() : '';
    var rows = document.querySelectorAll('#membersTable tbody tr');

    rows.forEach(function(r) {
      var text = (r.innerText || '').toLocaleLowerCase();
      var rRole = String(r.getAttribute('data-role') || '').trim().toUpperCase();
      var rStatus = String(r.getAttribute('data-status') || '').trim().toUpperCase();

      var matchText = !q || text.indexOf(q) !== -1;
      var matchRole = !role || rRole === role;
      var matchStatus = !status || rStatus === status;

      r.style.display = (matchText && matchRole && matchStatus) ? '' : 'none';
    });
  }

  function renderProfileView() {
    var u = STATE.user || {};
    return '<div class="row g-3 g-md-4">' +
      '<div class="col-12 col-lg-6"><div class="card-custom p-3 p-md-4 profile-page-card"><h5 class="fw-bold mb-3 fs-6 fs-md-5"><i class="bi bi-person-gear me-2"></i>Edit Profil Saya</h5><form onsubmit="handleUpdateProfile(event)"><div class="mb-3"><label class="form-label small fw-bold">Nama Lengkap</label><input type="text" id="profNama" class="form-control" value="' + (u.nama || '') + '" required></div><div class="mb-3"><label class="form-label small fw-bold">Email (Tidak dapat diubah)</label><input type="email" id="profEmail" class="form-control" value="' + (u.email || '') + '" disabled></div><div class="mb-4"><label class="form-label small fw-bold">Role</label><input type="text" class="form-control" value="' + formatFrontendLabel(u.role || '') + '" disabled></div><button type="submit" class="btn btn-primary-custom w-100 w-md-auto py-2">Simpan Perubahan</button></form></div></div>' +
      '<div class="col-12 col-lg-6"><div class="card-custom p-3 p-md-4 profile-page-card"><h5 class="fw-bold mb-3 fs-6 fs-md-5"><i class="bi bi-shield-lock me-2"></i>Ubah Password</h5><form onsubmit="handleChangePassword(event)"><div class="mb-3"><label class="form-label small fw-bold">Password Lama</label><input type="password" id="passOld" class="form-control" required></div><div class="mb-3"><label class="form-label small fw-bold">Password Baru</label><input type="password" id="passNew" class="form-control" required></div><div class="mb-4"><label class="form-label small fw-bold">Konfirmasi Password Baru</label><input type="password" id="passConf" class="form-control" required></div><button type="submit" class="btn btn-primary-custom w-100 w-md-auto py-2">Ubah Password</button></form></div></div>' +
    '</div>';
  }

  function handleUpdateProfile(e) {
    e.preventDefault();
    var payload = {
      nama: document.getElementById('profNama').value
    };
    showLoading(false);
    runBackend('updateProfile', STATE.token, payload).then(function(res) {
      hideLoading();
      if (res.success) {
        STATE.user = res.user;
        showToast(res.message);
        renderView('profile');
      } else { showToast(res.message, 'error'); }
    });
  }

  function handleChangePassword(e) {
    e.preventDefault();
    var o = document.getElementById('passOld').value;
    var n = document.getElementById('passNew').value;
    var c = document.getElementById('passConf').value;

    if (n !== c) {
      showToast('Password baru dan konfirmasi tidak sama.', 'error');
      return;
    }

    showLoading(false);
    runBackend('changePassword', STATE.token, o, n).then(function(res) {
      hideLoading();
      if (res.success) {
        showToast(res.message);
        document.getElementById('passOld').value = '';
        document.getElementById('passNew').value = '';
        document.getElementById('passConf').value = '';
      } else { showToast(res.message, 'error'); }
    });
  }

  function renderSettingsView(s) {
    s = s || STATE.settings;
    var defaultTheme = s.default_theme || 'light';

    return '<div class="row g-3 g-md-4">' +
      '<div class="col-12 col-lg-8 mx-auto">' +
        '<div class="card-custom p-3 p-md-4 settings-general-card">' +
          '<div class="d-flex align-items-center justify-content-between gap-2 flex-wrap mb-3"><h5 class="fw-bold mb-0 fs-6 fs-md-5"><i class="bi bi-sliders me-2"></i>Pengaturan Website Umum</h5>' +
          ((STATE.user && STATE.user.role === 'ADMIN') ? '<button type="button" class="btn btn-sm ' + (STATE.isPreviewMode ? 'btn-warning' : 'btn-outline-primary') + ' fw-semibold text-nowrap" onclick="togglePreviewMode()"><i class="bi ' + (STATE.isPreviewMode ? 'bi-eye-slash-fill' : 'bi-eye-fill') + ' me-1"></i>' + (STATE.isPreviewMode ? 'Keluar Pratinjau' : 'Tampilan Member') + '</button>' : '') +
          '</div>' +
          '<form onsubmit="handleSaveSettings(event)">' +
            '<div class="mb-3"><label class="form-label small fw-bold">Nama Website</label><input type="text" id="sSiteName" class="form-control" value="' + (s.site_name || 'WHY DEV') + '" required></div>' +
            '<div class="mb-3"><label class="form-label small fw-bold">Logo Website</label><div class="image-source-row"><div class="image-file-picker"><input type="file" id="sLogoFile" class="whydev-file-input" accept="image/*" onchange="syncImageSource(\'sLogoFile\',\'sLogoUrl\',\'sLogoFileName\',\'file\')"><button type="button" class="whydev-file-btn" onclick="openStyledFilePicker(\'sLogoFile\')"><i class="bi bi-image me-2"></i>Pilih File</button><span id="sLogoFileName" class="whydev-file-name">Belum ada file dipilih</span></div><input type="url" id="sLogoUrl" class="form-control image-link-input" placeholder="Masukkan link logo / Google Drive" oninput="syncImageSource(\'sLogoFile\',\'sLogoUrl\',\'sLogoFileName\',\'link\')"></div><div class="form-text">Pilih file atau gunakan link logo.</div></div>' +
            '<div class="mb-3"><label class="form-label small fw-bold">Tema Default</label><select id="sDefaultTheme" class="form-select"><option value="light" ' + (defaultTheme === 'light' ? 'selected' : '') + '>Light (Terang)</option><option value="dark" ' + (defaultTheme === 'dark' ? 'selected' : '') + '>Dark (Gelap)</option></select></div>' +
            '<div class="mb-4"><label class="form-label small fw-bold">Teks Footer Aplikasi</label><input type="text" id="sFooter" class="form-control" value="' + (s.footer_text || '') + '" required></div>' +
            '<button type="submit" class="btn btn-primary-custom w-100 py-2">Simpan Pengaturan Umum</button>' +
          '</form>' +
        '</div>' +
      '</div>' +
    '</div>';

  async function handleSaveSettings(e) {
    e.preventDefault();
    var logoUrl = await getImageSource('sLogoFile','sLogoUrl', STATE.settings.logo_url || '', false);
    var selectedTheme = document.getElementById('sDefaultTheme').value;
    showLoading(false);

    var payload = {
      site_name: document.getElementById('sSiteName').value,
      footer_text: document.getElementById('sFooter').value,
      default_theme: selectedTheme,
      logo_url: logoUrl
    };

    runBackend('updateSettings', STATE.token, payload).then(function(res) {
      hideLoading();
      if (res.success) {
        applyTheme(selectedTheme);
        showToast(res.message);
        STATE.settingsCache = null;
        loadSettings(function() { renderView('settings'); });
      } else { 
        showToast(res.message, 'error'); 
      }
    }).catch(function(err) { 
      hideLoading(); 
      showToast(err.message, 'error'); 
    });
  }

  function renderEmptyState() {
    return '<div class="card-custom p-4 p-md-5 text-center my-3 my-md-4">' +
      '<i class="bi bi-inbox fs-1 text-muted mb-2"></i>' +
      '<h5 class="fw-bold fs-6 fs-md-5">Belum Ada Data</h5>' +
      '<p class="text-muted small mb-0">Data akan muncul setelah admin menambahkannya.</p>' +
    '</div>';
  }

  function confirmDelete(backendFn, id) {
    var old = document.getElementById('whydevConfirmOverlay');
    if (old) old.remove();

    var overlay = document.createElement('div');
    overlay.id = 'whydevConfirmOverlay';
    overlay.className = 'whydev-confirm-overlay';
    overlay.innerHTML = '<div class="whydev-confirm-card whydev-delete-confirm-card" role="dialog" aria-modal="true" aria-labelledby="whyDeleteTitle">' +
      '<div class="whydev-confirm-icon" style="background:rgba(239,68,68,.11);color:#EF4444;"><i class="bi bi-trash3-fill"></i></div>' +
      '<h5 id="whyDeleteTitle" class="fw-bold mb-2">Konfirmasi Hapus</h5>' +
      '<p class="text-muted small mb-4">Apakah Anda yakin ingin menghapus data ini? Tindakan ini tidak dapat dibatalkan.</p>' +
      '<div class="d-flex gap-2 justify-content-center"><button type="button" class="btn btn-outline-secondary px-4" data-choice="no">Batal</button><button type="button" class="btn btn-danger px-4 fw-bold" data-choice="yes"><i class="bi bi-trash3 me-1"></i>Hapus</button></div>' +
      '</div>';

    function finish(value) {
      document.removeEventListener('keydown', onEscape);
      overlay.remove();
      if (value) executeDelete(backendFn, id);
    }
    function onEscape(ev) {
      if (ev.key === 'Escape' && document.getElementById('whydevConfirmOverlay')) finish(false);
    }
    overlay.addEventListener('click', function(ev) {
      if (ev.target === overlay) finish(false);
      var choice = ev.target.closest('[data-choice]');
      if (choice) finish(choice.getAttribute('data-choice') === 'yes');
    });
    document.addEventListener('keydown', onEscape);
    document.body.appendChild(overlay);
  }

  function executeDelete(backendFn, id) {
    crudModalInstance.hide();
    showLoading(false);
    runBackend(backendFn, STATE.token, id).then(function(res) {
      hideLoading();
      if (res.success) {
        showToast(res.message);
        if (backendFn === 'deleteMember') STATE.dataStore.members = {};
        preloadAllData();
        loadViewContent(STATE.currentView);
      } else { showToast(res.message, 'error'); }
    });
  }


  var WHYDEV_SALES_URL = 'https://lynk.id/whydevportal/k31j4p484lgj';

  function showDemoJoinAlert() {
    var old = document.getElementById('whydevDemoJoinOverlay');
    if (old) old.remove();

    var overlay = document.createElement('div');
    overlay.id = 'whydevDemoJoinOverlay';
    overlay.className = 'whydev-confirm-overlay';
    overlay.innerHTML = '<div class="whydev-confirm-card whydev-demo-join-card" role="dialog" aria-modal="true" aria-labelledby="whyDemoJoinTitle">' +
      '<div class="whydev-confirm-icon"><i class="bi bi-lock-fill"></i></div>' +
      '<h5 id="whyDemoJoinTitle" class="fw-bold mb-2">Yuk, Jadi Member Why Dev!</h5>' +
      '<p class="text-muted small mb-3">Kamu sedang berada di mode demo. Gabung menjadi member Why Dev untuk membuka akses penuh ke seluruh konten, tools, dan fitur eksklusif yang tersedia.</p>' +
      '<div class="d-flex flex-column gap-2">' +
        '<button type="button" class="btn btn-primary-custom fw-bold" data-demo-join="yes"><i class="bi bi-unlock-fill me-1"></i>Gabung Member Sekarang</button>' +
        '<button type="button" class="btn btn-outline-secondary" data-demo-join="no">Nanti Saja</button>' +
      '</div>' +
    '</div>';

    function closeAlert() {
      document.removeEventListener('keydown', onKeyDown);
      if (overlay.parentNode) overlay.remove();
    }
    function onKeyDown(ev) {
      if (ev.key === 'Escape') closeAlert();
    }
    overlay.addEventListener('click', function(ev) {
      if (ev.target === overlay) {
        closeAlert();
        return;
      }
      var choice = ev.target.closest('[data-demo-join]');
      if (!choice) return;
      if (choice.getAttribute('data-demo-join') === 'yes') {
        closeAlert();
        window.open(WHYDEV_SALES_URL, '_blank', 'noopener,noreferrer');
      } else {
        closeAlert();
      }
    });
    document.addEventListener('keydown', onKeyDown);
    document.body.appendChild(overlay);
  }

  // Akun demo tetap boleh menjelajahi menu, tetapi semua aksi pada kartu konten dikunci.
  document.addEventListener('click', function(ev) {
    if (!STATE.user || String(STATE.user.role || '').toUpperCase() !== 'DEMO') return;
    var contentViews = ['courses', 'tools', 'websites', 'accessWebs', 'bonuses', 'community', 'karyaMembers'];
    if (contentViews.indexOf(String(STATE.currentView || '')) === -1) return;
    var action = ev.target && ev.target.closest ? ev.target.closest('#mainContent a, #mainContent button, #mainContent [onclick]') : null;
    if (!action) return;
    ev.preventDefault();
    ev.stopPropagation();
    if (typeof ev.stopImmediatePropagation === 'function') ev.stopImmediatePropagation();
    showDemoJoinAlert();
  }, true);

</script>
