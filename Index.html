<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Why Dev Member Portal</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" media="print" onload="this.media='all'">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    :root {
      --bg-main: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --primary-blue: #2563EB;
      --primary-dark: #1D4ED8;
      --primary-light: #EFF6FF;
      --border-color: #E2E8F0;
      --sidebar-width: 260px;
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    [data-theme="dark"] {
      --bg-main: #0B132B;
      --bg-card: #1C2541;
      --text-main: #F8FAFC;
      --text-muted: #CBD5E1;
      --primary-blue: #3B82F6;
      --primary-dark: #2563EB;
      --primary-light: rgba(59, 130, 246, 0.15);
      --border-color: #334155;
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.011em;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    .preview-mode-banner {
      background: linear-gradient(90deg, #F59E0B, #D97706);
      color: #FFFFFF;
      padding: 6px 16px;
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 34px;
      z-index: 1060;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
    }

    body.has-preview-banner .app-header {
      top: 34px !important;
    }

    body.has-preview-banner .app-sidebar {
      top: 34px !important;
      height: calc(100vh - 34px) !important;
    }

    body.has-preview-banner .content-container {
      margin-top: 88px !important;
    }

    .hover-primary {
      color: var(--text-muted) !important;
      transition: color 0.2s ease;
    }

    .hover-primary:hover {
      color: var(--primary-blue) !important;
    }

    [data-theme="dark"] .hover-primary {
      color: #CBD5E1 !important;
    }

    [data-theme="dark"] .hover-primary:hover {
      color: #60A5FA !important;
    }

    .accordion-item {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
    }

    .accordion-button {
      background-color: var(--bg-card);
      color: var(--text-main);
      box-shadow: none;
    }

    .accordion-button:not(.collapsed) {
      background-color: var(--primary-light);
      color: var(--primary-blue);
      box-shadow: none;
    }

    .accordion-button:focus {
      box-shadow: none;
      border-color: rgba(37, 99, 235, 0.25);
    }

    [data-theme="dark"] .accordion-item {
      background-color: var(--bg-card) !important;
      border-color: var(--border-color) !important;
    }

    [data-theme="dark"] .accordion-button {
      background-color: var(--bg-card) !important;
      color: #F8FAFC !important;
    }

    [data-theme="dark"] .accordion-button:not(.collapsed) {
      background-color: rgba(59, 130, 246, 0.2) !important;
      color: #60A5FA !important;
    }

    [data-theme="dark"] .accordion-button::after {
      filter: invert(1) grayscale(100%) brightness(200%);
    }

    [data-theme="dark"] .accordion-body {
      background-color: var(--bg-card) !important;
      color: #CBD5E1 !important;
    }

    .icon-dashboard { color: #2563EB !important; }
    .icon-courses { color: #EF4444 !important; }
    .icon-tools { color: #F59E0B !important; }
    .icon-websites { color: #06B6D4 !important; }
    .icon-access { color: #10B981 !important; }
    .icon-bonus { color: #8B5CF6 !important; }
    .icon-community { color: #EC4899 !important; }
    .icon-members { color: #F97316 !important; }
    .icon-settings { color: #64748B !important; }

    .nav-link-custom.active i {
      color: #FFFFFF !important;
    }

    .welcome-card {
      padding: 28px 24px !important;
      background: linear-gradient(135deg, var(--primary-blue), var(--primary-dark)) !important;
      color: #FFFFFF !important;
      border: none !important;
      border-radius: 16px !important;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.28) !important;
      width: 100% !important;
      box-sizing: border-box !important;
      margin-bottom: 22px !important;
      min-height: 100px !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
    }

    .welcome-title {
      font-size: 1.1rem !important;
      font-weight: 700 !important;
      margin-bottom: 8px !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      color: #FFFFFF !important;
      line-height: 1.3 !important;
      display: block !important;
    }

    .welcome-sub {
      font-size: 0.85rem !important;
      opacity: 0.95 !important;
      margin-bottom: 0 !important;
      line-height: 1.5 !important;
      color: rgba(255, 255, 255, 0.92) !important;
    }

    @media (min-width: 768px) {
      .welcome-card {
        padding: 34px 32px !important;
        min-height: 115px !important;
      }
      .welcome-title {
        font-size: 1.3rem !important;
        margin-bottom: 10px !important;
      }
      .welcome-sub {
        font-size: 0.92rem !important;
      }
    }

    .header-datetime-box {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: none;
    }

    #headerTime {
      color: var(--primary-blue) !important;
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: 1px;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-blue), var(--primary-dark));
      color: #FFFFFF;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease !important;
    }

    .user-avatar:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35) !important;
    }

    .dropdown-menu {
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1) !important;
      background-color: var(--bg-card);
    }

    .dropdown-item {
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    [data-theme="dark"] .dropdown-menu {
      background-color: #1C2541;
      border-color: var(--border-color);
      color: #F8FAFC;
    }

    [data-theme="dark"] .dropdown-item {
      color: #CBD5E1 !important;
    }

    [data-theme="dark"] .dropdown-item.text-danger {
      color: #EF4444 !important;
    }

    [data-theme="dark"] .dropdown-item:hover {
      background-color: rgba(255, 255, 255, 0.08);
      color: #F8FAFC !important;
    }

    [data-theme="dark"] .dropdown-item.text-danger:hover {
      color: #F87171 !important;
      background-color: rgba(239, 68, 68, 0.15) !important;
    }

    .theme-toggle-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease !important;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .theme-toggle-btn:hover {
      transform: translateY(-2px) scale(1.04) !important;
      border-color: var(--primary-blue) !important;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2) !important;
    }

    .theme-toggle-btn i {
      transition: opacity 0.2s ease;
    }

    .theme-toggle-btn:hover i {
      opacity: 0.85;
    }

    /* --- STYLING KHUSUS IKON LONCENG NOTIFIKASI & POPUP --- */
    .notif-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease !important;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .notif-btn:hover {
      transform: translateY(-2px) scale(1.04) !important;
      border-color: var(--primary-blue) !important;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2) !important;
    }

    .notif-badge-dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 9px;
      height: 9px;
      background-color: #EF4444;
      border: 2px solid var(--bg-card);
      border-radius: 50%;
      display: none;
    }

    .notif-badge-dot.show {
      display: block !important;
    }

    .notif-dropdown-menu {
      width: 360px;
      max-width: 90vw;
      padding: 0;
      border-radius: 14px !important;
      overflow: hidden;
      border: 1px solid var(--border-color) !important;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15) !important;
      background-color: var(--bg-card);
    }

    .notif-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-card);
    }

    .notif-list-container {
      max-height: 380px;
      overflow-y: auto;
    }

    .notif-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      text-decoration: none;
      color: var(--text-main);
    }

    .notif-item:last-child {
      border-bottom: none;
    }

    .notif-content {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .notif-title {
      white-space: normal;
      overflow-wrap: anywhere;
      margin-bottom: 3px;
    }

    .notif-message-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      min-width: 0;
      max-width: 100%;
    }

    .notif-message {
      flex: 1 1 auto;
      min-width: 0;
      white-space: normal;
      overflow-wrap: anywhere;
      line-height: 1.35;
      font-size: 0.75rem;
    }

    .notif-message-full {
      font-size: 0.8rem;
    }

    .notif-date {
      flex: 0 0 auto;
      white-space: nowrap;
      font-size: 0.65rem;
      text-align: right;
    }

    .notif-item.unread {
      background-color: var(--primary-light);
    }

    .notif-item:hover {
      background-color: rgba(37, 99, 235, 0.08);
      color: var(--text-main);
    }

    .notif-icon-box {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .notif-footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border-color);
      text-align: center;
      background-color: var(--bg-card);
    }

    [data-theme="dark"] .notif-dropdown-menu {
      background-color: #1C2541 !important;
      border-color: var(--border-color) !important;
    }

    [data-theme="dark"] .notif-header,
    [data-theme="dark"] .notif-footer {
      background-color: #1C2541 !important;
    }

    [data-theme="dark"] .notif-item {
      color: #F8FAFC !important;
      border-color: var(--border-color) !important;
    }

    [data-theme="dark"] .notif-item.unread {
      background-color: rgba(59, 130, 246, 0.18) !important;
    }

    [data-theme="dark"] .notif-item:hover {
      background-color: rgba(255, 255, 255, 0.08) !important;
    }

    .notif-footer a {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.2s ease, background-color 0.2s ease;
      cursor: pointer;
    }

    .notif-footer a:hover {
      color: var(--primary-blue) !important;
      background-color: var(--primary-light);
    }

    .notif-footer {
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .notif-footer:hover {
      background-color: var(--primary-light);
    }

    .notif-footer-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--primary-blue);
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 7px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .notif-footer-btn:hover {
      background-color: rgba(37, 99, 235, 0.10);
      color: var(--primary-blue);
    }

    .account-menu-item {
      width: 100% !important;
      min-width: 170px;
      height: 38px;
      padding: 0.45rem 0.75rem !important;
      box-sizing: border-box;
    }

    .image-source-row {
      display: flex;
      align-items: stretch;
      gap: 10px;
    }

    .image-file-picker {
      min-width: 0;
      flex: 1 1 50%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 10px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--bg-soft, #F8FAFC);
    }

    .whydev-file-input {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .whydev-file-btn {
      flex-shrink: 0;
      border: 1px solid rgba(37, 99, 235, 0.22);
      border-radius: 9px;
      padding: 8px 12px;
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.18);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }

    .whydev-file-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
      filter: brightness(1.04);
    }

    .whydev-file-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-muted);
      font-size: 0.76rem;
    }

    .image-link-input {
      flex: 1 1 50%;
      min-width: 0;
    }

    [data-theme="dark"] .image-file-picker {
      background: #17213B;
    }

    @media (max-width: 576px) {
      .image-source-row {
        flex-direction: column;
      }
      .image-file-picker, .image-link-input {
        width: 100%;
        flex-basis: auto;
      }
    }

    .notif-color-dashboard { color: #2563EB; background-color: rgba(37, 99, 235, 0.10); }
    .notif-color-courses { color: #EF4444; background-color: rgba(239, 68, 68, 0.10); }
    .notif-color-tools { color: #F59E0B; background-color: rgba(245, 158, 11, 0.12); }
    .notif-color-websites { color: #06B6D4; background-color: rgba(6, 182, 212, 0.10); }
    .notif-color-access { color: #10B981; background-color: rgba(16, 185, 129, 0.10); }
    .notif-color-bonus { color: #8B5CF6; background-color: rgba(139, 92, 246, 0.10); }
    .notif-color-community { color: #EC4899; background-color: rgba(236, 72, 153, 0.10); }
    .notif-color-karya { color: #F59E0B; background-color: rgba(245, 158, 11, 0.12); }
    .notif-color-members { color: #F97316; background-color: rgba(249, 115, 22, 0.10); }
    .notif-color-settings { color: #64748B; background-color: rgba(100, 116, 139, 0.10); }

    /* Kelola Member: titik online dan email selalu sejajar; kolom email tidak membungkus teks */
    .members-table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    #membersTable {
      min-width: 760px;
    }
    #membersTable .member-email-cell {
      white-space: nowrap !important;
      overflow-wrap: normal !important;
      word-break: normal !important;
    }
    #membersTable .member-email-line {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      max-width: none;
    }
    #membersTable .member-email-line > span:last-child {
      white-space: nowrap;
    }
    #membersTable .member-online-dot {
      display: inline-block;
      flex: 0 0 8px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin: 0;
      vertical-align: middle;
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.12);
    }

    /* Khusus halaman Kelola Member: laptop pas tanpa scroll samping */
    @media (min-width: 992px) {
      #membersTable {
        width: 100% !important;
        table-layout: fixed;
        font-size: 0.84rem;
      }
      #membersTable th,
      #membersTable td {
        padding: 0.56rem 0.48rem;
        vertical-align: middle;
      }
      #membersTable th { font-size: 1rem; }
      #membersTable th:nth-child(1), #membersTable td:nth-child(1) { width: 5%; }
      #membersTable th:nth-child(2), #membersTable td:nth-child(2) { width: 42%; font-size: 1rem; }
      #membersTable th:nth-child(3), #membersTable td:nth-child(3) { width: 11%; }
      #membersTable th:nth-child(4), #membersTable td:nth-child(4) { width: 11%; }
      #membersTable th:nth-child(5), #membersTable td:nth-child(5) { width: 11%; }
      #membersTable th:nth-child(6), #membersTable td:nth-child(6) { width: 20%; }
      #membersTable td:nth-child(2) {
        white-space: nowrap;
        overflow-wrap: normal;
        word-break: normal;
      }
      #membersTable .btn-group {
        display: flex;
        width: 100%;
      }
      #membersTable .btn-group .btn {
        flex: 1 1 0;
        min-width: 0;
        padding: 0.34rem 0.28rem;
      }
      #membersTable .badge {
        font-size: 0.68rem;
        white-space: nowrap;
        min-width: 72px;
        justify-content: center;
        display: inline-flex;
        align-items: center;
      }
      #membersTable .member-online-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
        margin-right: 7px;
        vertical-align: middle;
        box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.12);
      }
    }

    /* Skeleton shimmer untuk thumbnail */
    .card-img-wrapper {
      position: relative;
      overflow: hidden;
      background: var(--bg-soft, #F1F5F9);
    }

    .card-img-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.58) 50%, transparent 100%);
      background-size: 200% 100%;
      animation: thumbnailShimmer 1.35s linear infinite;
    }

    .card-img-wrapper img {
      position: relative;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.22s ease;
    }

    .lazy-image-icon {
      position: absolute;
      z-index: 0;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94A3B8;
      font-size: 2.4rem;
      opacity: 0.9;
      pointer-events: none;
    }

    .tutorial-img-wrapper::before,
    .tutorial-img-wrapper .lazy-image-icon {
      display: none;
    }

    .tutorial-img-wrapper img {
      opacity: 1;
    }

    .tutorial-play-overlay {
      z-index: 3;
      pointer-events: none;
    }

    .card-img-wrapper img.img-loaded {
      opacity: 1;
    }

    @keyframes thumbnailShimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    [data-theme="dark"] .card-img-wrapper {
      background: #25304A;
    }

    [data-theme="dark"] .card-img-wrapper::before {
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.10) 50%, transparent 100%);
      background-size: 200% 100%;
    }

    [data-theme="dark"] .lazy-image-icon {
      color: #94A3B8;
    }

    .password-input-wrapper {
      position: relative;
      width: 100%;
    }

    .password-toggle-inside {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;

.lp-feature-card, .lp-step-card, .lp-benefit-card {
  position: relative;
  overflow: hidden;
  background: var(--bg-card, #131b2e);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  padding: 1.5rem;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 1;
  height: 100%;
}

.lp-feature-card::before, .lp-step-card::before, .lp-benefit-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 16px;
  padding: 1.5px;
  background: linear-gradient(135deg, var(--card-accent-color, #3b82f6) 0%, transparent 65%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0.35;
  transition: opacity 0.35s ease;
  pointer-events: none;
}

.lp-feature-watermark, .lp-step-watermark, .lp-benefit-watermark {
  position: absolute;
  right: -15px;
  bottom: -20px;
  font-size: 6.5rem;
  line-height: 1;
  opacity: 0.05;
  color: var(--card-accent-color, #ffffff);
  pointer-events: none;
  transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
  z-index: 0;
}

.lp-feature-card:hover, .lp-step-card:hover, .lp-benefit-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 14px 30px -10px var(--card-glow-color, rgba(59, 130, 246, 0.35));
}

.lp-feature-card:hover::before, .lp-step-card:hover::before, .lp-benefit-card:hover::before {
  opacity: 1;
}

.lp-feature-card:hover .lp-feature-watermark,
.lp-step-card:hover .lp-step-watermark,
.lp-benefit-card:hover .lp-benefit-watermark {
  transform: scale(1.18) rotate(-6deg);
  opacity: 0.12;
}

.lp-feature-card .lp-feature-icon,
.lp-step-card .lp-step-icon-box,
.lp-benefit-card .lp-benefit-icon {
  position: relative;
  z-index: 1;
  transition: transform 0.3s ease;
}

.lp-feature-card:hover .lp-feature-icon,
.lp-step-card:hover .lp-step-icon-box,
.lp-benefit-card:hover .lp-benefit-icon {
  transform: scale(1.08);
}
